          methods: "omps_api_methods_v1",
          dockets: "omps_api_dockets_v1",
          kundli: "omps_api_kundli_v1"
        };
        function readLS(k, fallback) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : fallback;
          } catch { return fallback; }
        }
        function writeLS(k, v) {
          try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
        }
        function jsonResp(obj, status) {
          return new Response(JSON.stringify(obj), {
            status: status || 200,
            headers: { "Content-Type": "application/json; charset=utf-8" }
          });
        }
        async function loadBaseJson(relPath) {
          const r = await origFetch(relPath);
          return await r.json();
        }
        async function readBody(init) {
          if (!init || !init.body) return {};
          if (typeof init.body === "string") {
            try { return JSON.parse(init.body); } catch { return {}; }
          }
          return {};
        }
        window.fetch = async function (input, init) {
          const urlStr = typeof input === "string" ? input : (input && input.url) || "";
          let parsed;
          try { parsed = new URL(urlStr, window.location.href); } catch { return origFetch(input, init); }
          const p = parsed.pathname;
          const idx = p.indexOf("/api/");
          if (idx === -1) return origFetch(input, init);
          const apiPath = p.slice(idx);
          const method = ((init && init.method) || "GET").toUpperCase();

          if (apiPath === "/api/health" && method === "GET") {
            return origFetch("./api/health.json");
          }
          if (apiPath === "/api/github/repos" && method === "GET") {
            return origFetch("./api/github/repos.json");
          }
          if (apiPath === "/api/github/repo-tree" && method === "GET") {
            return origFetch("./api/github/repo-tree.json");
          }
          if (apiPath === "/api/github/commit-and-bundle" && method === "POST") {
            return jsonResp({ ok: true, commitHash: "gh-pages" });
          }
          if (apiPath === "/api/auth/sync") {
            return jsonResp({ ok: true, synced: true });
          }
          if (apiPath === "/api/crowdfunding/pledges") {
            const base = await loadBaseJson("./api/crowdfunding/pledges.json");
            const extra = readLS(LS.pledges, []);
            if (method === "GET") {
              return jsonResp({ pledges: [...extra, ...(base.pledges || [])] });
            }
            if (method === "POST") {
              const b = await readBody(init);
              const pledge = {
                id: Date.now(),
                backerName: b.backerName || "Anonymous Backer",

                upiEscrowVerified: true

          }
          if (apiPath === "/api/promotion/pipeline" && method === "GET") {
            const base = await loadBaseJson("./api/promotion/pipeline.json");
            const extra = readLS(LS.outreach, []);
            const allLogs = [...extra, ...(base.outreachLogs || [])];
            const addedInr = extra.reduce((acc, x) => acc + (Number(x.amountInr) || 0), 0);
            const lockedExtra = extra.filter((x) => x.status === "slot_locked").length;
            const m = Object.assign({}, base.metrics || {});
            m.activeOutreachPipelineInr = (m.activeOutreachPipelineInr || 0) + addedInr;
            m.confirmedAndReservedInr = (m.confirmedAndReservedInr || 0) + addedInr;
            m.totalWithBackersInr = (m.totalWithBackersInr || 0) + addedInr;
            m.lockedSlotsCount = (m.lockedSlotsCount || 0) + lockedExtra;
            m.remainingSlotsCount = Math.max(0, (m.totalSlotsToday || 3) - m.lockedSlotsCount);
            return jsonResp({ metrics: m, outreachLogs: allLogs });
          }
          if (apiPath === "/api/promotion/outreach" && method === "POST") {
            const b = await readBody(init);
            const base = await loadBaseJson("./api/promotion/pipeline.json");
            const extra = readLS(LS.outreach, []);
            const entry = {
              id: Date.now(),
              prospectName: b.prospectName || "Studio Prospect",
              targetUrlOrCompany: b.targetUrlOrCompany || SITE_URL,
              contactChannel: b.contactChannel || "email",

              status: b.status || "sent",
              pitchSummary: b.pitchSummary || "Dispatched Studio outreach.",
              createdAt: new Date().toISOString()
            };
            const nextExtra = [entry, ...extra];
            writeLS(LS.outreach, nextExtra);
            const allLogs = [...nextExtra, ...(base.outreachLogs || [])];
            const addedInr = nextExtra.reduce((acc, x) => acc + (Number(x.amountInr) || 0), 0);
            const lockedExtra = nextExtra.filter((x) => x.status === "slot_locked").length;
            const m = Object.assign({}, base.metrics || {});
            m.activeOutreachPipelineInr = (m.activeOutreachPipelineInr || 0) + addedInr;

            m.lockedSlotsCount = (m.lockedSlotsCount || 0) + lockedExtra;
            m.remainingSlotsCount = Math.max(0, (m.totalSlotsToday || 3) - m.lockedSlotsCount);
            return jsonResp({ ok: true, outreachLogs: allLogs, metrics: m }, 201);
          }
          if (apiPath.startsWith("/api/payment-methods")) {
            const base = await loadBaseJson("./api/payment-methods.json");
            let custom = readLS(LS.methods, null);
            if (!custom) custom = base.methods || [];
            if (method === "GET") {
              return jsonResp({ methods: custom });

            if (method === "POST") {
              const b = await readBody(init);
              const item = Object.assign({ id: Date.now(), createdAt: new Date().toISOString() }, b);
              custom = [item, ...custom];
              writeLS(LS.methods, custom);
              return jsonResp({ ok: true, method: item }, 201);
            }
            if (method === "DELETE") {
              const idStr = apiPath.split("/").pop();
              custom = custom.filter((x) => String(x.id) !== String(idStr));
              writeLS(LS.methods, custom);
              return jsonResp({ ok: true });

          }
          if (apiPath === "/api/dockets") {
            const items = readLS(LS.dockets, []);
            if (method === "GET") return jsonResp({ dockets: items });

            }
          }
          if (apiPath === "/api/kundli") {
            const items = readLS(LS.kundli, []);
            if (method === "GET") return jsonResp({ charts: items });

            const target = Math.max(1, Math.round(lines * 0.22));
            const pct = lines > 0 ? Math.min(89, Math.max(42, Math.round(((lines - target) / lines) * 100))) : 78;
            return jsonResp({

            return jsonResp({

              estimatedMonthlyWasteInr: waste,
              roastAnalysis: "Mobile Speed Audit for " + targetUrl + ":\n• Estimated Paid Ad Leakage: ₹" + waste.toLocaleString("en-IN") + "/mo\n• Target Sovereign Rebuild: <14ms First Contentful Paint · 100/100 Google Lighthouse Mobile\n• Live Studio Proof: " + SITE_URL + "/?edition=evo",
              suggestedSubject: subject,
              suggestedEmailBody: body
            });
          }
          if (apiPath === "/api/gemini/chat" && method === "POST") {
            const b = await readBody(init);
            const last = Array.isArray(b.messages) && b.messages.length ? b.messages[b.messages.length - 1].text : "";
            return jsonResp({
              ok: true,
              modelUsed: "om-panchal-studio-edge-index",
              groundingLinks: [{ title: "Om Panchal Studio (GitHub Pages)", uri: SITE_URL + "/?edition=evo" }, { title: "Master Edge Hub", uri: "https://omi811.github.io/" }],

            });
          }
          if (apiPath === "/api/gemini/search-audit" && method === "POST") {
            const b = await readBody(init);
            const brand = String(b.brandQuery || "D2C Storefront");
            return jsonResp({
              ok: true,
              groundingLinks: [{ title: "Speed Sprints & BUILT™ Audit", uri: SITE_URL + "/?edition=evo&project=audit-built" }],
